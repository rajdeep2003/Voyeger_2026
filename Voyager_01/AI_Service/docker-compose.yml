version: '3.8'

services:
  ai-service:
    build: .
    container_name: voyager-ai-service
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - OPENROUTE_API_KEY=${OPENROUTE_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - TOMTOM_API_KEY=${TOMTOM_API_KEY}
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:7.0
    container_name: voyager-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

volumes:
  mongodb_data:
